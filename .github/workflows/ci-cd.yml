name: CI/CD Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Run dbt at 00:30, 06:30, 12:30, 18:30 UTC.
    # Coordinate these times with Snowflake's COPY task.
    - cron: "30 0,6,12,18 * * *"

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------
  # Python CI
  # ------------------------------------------------------------

  python-tests:
    name: Python Tests
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/api.txt
            requirements/live.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/live.txt
          python -m pip install -r requirements/api.txt
          python -m pip install \
            paho-mqtt \
            python-dotenv \
            jsonschema \
            pytest \
            httpx

      - name: Run all Python tests
        run: python -m pytest tests/ -v

  # ------------------------------------------------------------
  # React CI
  # ------------------------------------------------------------

  dashboard:
    name: Dashboard Lint and Build
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build dashboard
        run: npm run build

  # ------------------------------------------------------------
  # dbt: Scheduled Snowflake transformations
  # ------------------------------------------------------------

  dbt:
    name: Build Snowflake Analytics Warehouse
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    environment: production

    concurrency:
      group: greenhouse-dbt-production
      cancel-in-progress: false

    defaults:
      run:
        working-directory: warehouse

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/warehouse/.ci-profiles

      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_DBT_USER }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_DBT_ROLE }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_DBT_KEY_PASSPHRASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dbt.txt

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../requirements/dbt.txt

      - name: Configure Snowflake credentials
        env:
          PRIVATE_KEY: ${{ secrets.SNOWFLAKE_DBT_PRIVATE_KEY }}
        run: |
          set -eu
          umask 077

          mkdir -p "$DBT_PROFILES_DIR"

          printf '%s\n' "$PRIVATE_KEY" \
            > "$RUNNER_TEMP/snowflake_dbt_key.pem"

          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/snowflake_dbt_key.pem" \
            >> "$GITHUB_ENV"

          cat > "$DBT_PROFILES_DIR/profiles.yml" <<'EOF'
          warehouse:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                role: "{{ env_var('SNOWFLAKE_ROLE') }}"
                warehouse: GREENHOUSE_WH
                database: GREENHOUSE_ANALYTICS
                schema: GREENHOUSE_DBT
                threads: 4
                authenticator: SNOWFLAKE_JWT
                private_key_file: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
                private_key_file_pwd: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"
          EOF

      - name: Verify Snowflake connection
        run: dbt debug

      - name: Build models and run tests
        run: dbt build --target prod

  # ------------------------------------------------------------
  # Raspberry Pi deployment
  # ------------------------------------------------------------

  deploy-pi:
    name: Deploy Raspberry Pi
    runs-on: ubuntu-latest
    needs: [python-tests, dashboard]

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    environment: production

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: greenhouse-pi-deployment
      cancel-in-progress: false

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PI_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy gateway
        env:
          PI_HOST: ${{ vars.PI_TAILSCALE_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
            "greenhousepi@$PI_HOST" 'bash -se' <<'REMOTE'
          set -e

          cd /home/greenhousepi/greenhouse-iot-streaming-pipeline

          git pull --ff-only origin main

          .venv/bin/python -m pip install \
            -r requirements/gateway.txt

          sudo -n systemctl restart greenhouse-ingest.service
          sudo -n systemctl restart greenhouse-kafka-producer.service

          sudo -n systemctl is-active --quiet greenhouse-ingest.service
          sudo -n systemctl is-active --quiet greenhouse-kafka-producer.service

          echo "Pi deployment successful"
          REMOTE

  # ------------------------------------------------------------
  # EC2 #2 deployment
  # ------------------------------------------------------------

  deploy-serving-ec2:
    name: Deploy Live Serving EC2
    runs-on: ubuntu-latest
    needs: [python-tests, dashboard]

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    environment: production

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: greenhouse-serving-deployment
      cancel-in-progress: false

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy serving services
        env:
          EC2_HOST: ${{ vars.EC2_TAILSCALE_HOST }}
          EC2_USER: ${{ vars.EC2_DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -e

          cd ~/greenhouse-iot-streaming-pipeline

          git pull --ff-only origin main

          docker compose up -d --build --no-deps \
            live-consumer historical-consumer api

          docker compose ps

          echo "Waiting for API to become ready..."

          for attempt in $(seq 1 20); do
              if curl --silent --show-error --fail \
                  --max-time 3 \
                  http://127.0.0.1:8000/health; then

                  echo
                  echo "API is healthy"
                  break
              fi

              if [ "$attempt" -eq 20 ]; then
                  echo "API failed health check"
                  docker compose logs --tail=100 api
                  exit 1
              fi

              sleep 3
          done

          echo "Serving deployment successful"
          REMOTE
