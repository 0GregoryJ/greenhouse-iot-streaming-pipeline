
name: CI/CD Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/api.txt
            requirements/live.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # Existing live consumer dependencies
          python -m pip install -r requirements/live.txt

          # Existing FastAPI dependencies
          python -m pip install -r requirements/api.txt

          # Gateway ingestion dependencies
          python -m pip install \
            paho-mqtt \
            python-dotenv \
            jsonschema

          # Testing dependencies
          python -m pip install \
            pytest \
            httpx

      - name: Run all Python tests
        run: |
          python -m pytest tests/ -v

  dashboard:
    name: Dashboard Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build dashboard
        run: npm run build


  deploy-pi:
    name: Deploy Raspberry Pi
    runs-on: ubuntu-latest
    needs: [python-tests, dashboard]

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    environment: production

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: greenhouse-pi-deployment
      cancel-in-progress: false

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PI_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy gateway
        env:
          PI_HOST: ${{ vars.PI_TAILSCALE_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
            "greenhousepi@$PI_HOST" 'bash -se' <<'REMOTE'
          set -e

          cd /home/greenhousepi/greenhouse-iot-streaming-pipeline

          git pull --ff-only origin main

          .venv/bin/python -m pip install \
            -r requirements/gateway.txt

          sudo -n systemctl restart greenhouse-ingest.service
          sudo -n systemctl restart greenhouse-kafka-producer.service

          sudo -n systemctl is-active --quiet greenhouse-ingest.service
          sudo -n systemctl is-active --quiet greenhouse-kafka-producer.service

          echo "Pi deployment successful"
          REMOTE


  deploy-serving-ec2:
    name: Deploy Live Serving EC2
    runs-on: ubuntu-latest
    needs: [python-tests, dashboard]

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    environment: production

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: greenhouse-serving-deployment
      cancel-in-progress: false

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy serving services
        env:
          EC2_HOST: ${{ vars.EC2_TAILSCALE_HOST }}
          EC2_USER: ${{ vars.EC2_DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -e

          cd ~/greenhouse-iot-streaming-pipeline

          git pull --ff-only origin main

          docker compose up -d --build --no-deps \
            live-consumer api

          docker compose ps

          curl --fail --retry 5 --retry-delay 2 \
            http://127.0.0.1:8000/health

          echo "Serving deployment successful"
          REMOTE
