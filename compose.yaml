
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  live-consumer:
    build:
      context: .
      dockerfile: consumers/live/dockerfile

    restart: unless-stopped

    depends_on:
      redis:
        condition: service_healthy

    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Kafka address required}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-greenhouse.sensor-readings}
      LIVE_KAFKA_CONSUMER_GROUP: ${LIVE_KAFKA_CONSUMER_GROUP:-greenhouse-live-dev}
      REDIS_HOST: redis

  api:
    build:
      context: .
      dockerfile: api/dockerfile

    restart: unless-stopped

    depends_on:
      redis:
        condition: service_healthy

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}

      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}

      SNOWFLAKE_PRIVATE_KEY_PATH: /run/secrets/snowflake_api_key.pem
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:?Snowflake private key passphrase required}

    volumes:
      # Host PEM from SNOWFLAKE_KEY_HOST_PATH; readable by the container user (appuser).
      - ${SNOWFLAKE_KEY_HOST_PATH:?Snowflake private key path required}:/run/secrets/snowflake_api_key.pem:ro

    ports:
      # Expose the API to your MacBook, not the entire network.
      # On EC2, an HTTPS reverse proxy will connect locally.
      - "127.0.0.1:8000:8000"

  historical-consumer:
    build:
      context: .
      dockerfile: consumers/historical/dockerfile

    restart: unless-stopped

    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Kafka address required}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-greenhouse.sensor-readings}
      HISTORICAL_KAFKA_CONSUMER_GROUP: ${HISTORICAL_KAFKA_CONSUMER_GROUP:-greenhouse-historical}

      S3_BUCKET: ${S3_BUCKET:?S3 bucket required}
      S3_PREFIX: ${S3_PREFIX:-raw/sensor_events}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-2}

      HISTORICAL_BATCH_SIZE: ${HISTORICAL_BATCH_SIZE:-240}
      HISTORICAL_FLUSH_SECONDS: ${HISTORICAL_FLUSH_SECONDS:-300}

    # Allow pending batches to upload and commit on shutdown.
    stop_grace_period: 60s

volumes:
  redis_data:
